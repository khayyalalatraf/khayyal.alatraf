  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>خيال الأطراف العقارية</title>
  <meta name="description" content="خيال الأطراف العقارية - تواصل معنا عبر واتساب للاستفسارات والطلبات.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background: #f7f5f2;
      color: #303030;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(720px, 100%);
      background: #fff;
      border-radius: 24px;
      padding: 42px 28px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
    }
    .logo {
      width: min(520px, 92%);
      max-height: 280px;
      object-fit: contain;
      margin-bottom: 18px;
    }
    h1 {
      margin: 8px 0;
      font-size: clamp(28px, 5vw, 42px);
    }
    p {
      color: #666;
      font-size: 18px;
      line-height: 1.8;
      margin: 12px auto 28px;
      max-width: 560px;
    }
    .btn {
      display: inline-block;
      background: #222;
      color: #fff;
      text-decoration: none;
      padding: 15px 28px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
    }
    .btn:hover { opacity: .9; }
    .note {
      margin-top: 24px;
      font-size: 13px;
      color: #999;
    }
  </style>
